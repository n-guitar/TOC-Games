<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1760" />
<title>TOC Games — Bottleneck Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fafaf9; }
  body { font-family: 'Inter', system-ui, sans-serif; min-width: 1720px; color: #1c1917; }
  button { font-family: inherit; }
  ul, ol, p { margin: 0 0 8px; }
  ul, ol { padding-left: 22px; }
  li { margin-bottom: 4px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
  @keyframes bn-pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(220,38,38,0.12), 0 4px 12px rgba(220,38,38,0.18); }
    50% { box-shadow: 0 0 0 8px rgba(220,38,38,0.18), 0 4px 18px rgba(220,38,38,0.28); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="game-engine.jsx"></script>
<script type="text/babel" src="process-flow.jsx"></script>
<script type="text/babel" src="sidebar-components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
function Root() {
  const [tweaks, setTweak] = window.useTweaks(window.TWEAK_DEFAULTS);
  return (
    <>
      <window.App tweaks={tweaks} setTweak={setTweak} />
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="ゲーム設定">
          <window.TweakRadio
            label="テーマ" value={tweaks.theme}
            onChange={(v) => setTweak('theme', v)}
            options={[{ value: 'factory', label: '工場' }, { value: 'web', label: 'Web' }]}
          />
          <window.TweakRadio
            label="難易度" value={tweaks.difficulty}
            onChange={(v) => setTweak('difficulty', v)}
            options={[
              { value: 'easy', label: 'Easy' },
              { value: 'normal', label: 'Normal' },
              { value: 'hard', label: 'Hard' },
            ]}
          />
          <window.TweakSlider
            label="アニメ速度" value={tweaks.animSpeed}
            onChange={(v) => setTweak('animSpeed', v)}
            min={0.5} max={3} step={0.25}
          />
          <window.TweakSlider
            label="イベント頻度" value={tweaks.eventFrequency}
            onChange={(v) => setTweak('eventFrequency', v)}
            min={0} max={1} step={0.1}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
